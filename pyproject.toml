[project]
name = "primer-vllm"
version = "0.1.0"
description = "Small executable lessons for serving LLMs with vLLM, locally or on an AWS GPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "ruff>=0.11",
    "openai>=1.0",
    "boto3>=1.35",
    "boto3-stubs[ec2,iam,ssm,pricing,service-quotas,sts]>=1.35",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
