repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-ast
      - id: debug-statements
      - id: check-added-large-files
      - id: check-merge-conflict

  # Same commands as `make lint` and `make typecheck`, so the hook, the
  # Makefile and CI cannot disagree.
  - repo: local
    hooks:
      - id: lint
        name: ruff (format check and lint)
        entry: make lint
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: typecheck
        name: mypy (strict)
        entry: make typecheck
        language: system
        types_or: [python, pyi]
        pass_filenames: false
